[project]
name = "watchtower"
version = "0.1.0"
description = "Autonomous Kubernetes incident-response agent and adversarial evaluation harness"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
