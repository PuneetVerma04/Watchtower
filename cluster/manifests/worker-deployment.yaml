apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: watchtower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: worker:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: ORDERS_URL
              value: http://orders:8000
            - name: MEMORY_LEAK_ENABLED
              value: "false"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
